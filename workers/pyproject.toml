[project]
name = "hirelens-workers"
version = "0.1.0"
description = "HireLens Background Workers — Resume Parsing, AI Scoring, Async Tasks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.2.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "boto3>=1.35.0",
    "PyMuPDF>=1.24.0",
    "httpx>=0.28.0",
    "groq>=0.11.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
